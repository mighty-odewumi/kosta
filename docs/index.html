<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kosta API | Swagger UI</title>
<meta name="description" content="Interactive Swagger docs for Kosta, a payments and ledger API for wallet apps.">
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.35.0/swagger-ui.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: #fafafa; }
  .bar { background: #0f172a; color: #cbd5e1; font: 14px Inter, -apple-system, "Segoe UI", sans-serif; padding: 12px 20px; position: sticky; top: 0; z-index: 10; }
  .wrap { max-width: 1460px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .btn { background: #14b8a6; color: #04201d; border: 0; border-radius: 8px; padding: 8px 14px; font: 600 14px Inter, sans-serif; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: progress; }
  .status { color: #94a3b8; }
  .status.err { color: #fca5a5; }
  .session { display: none; }
  .session.on { display: inline; }
  .link-btn { background: none; border: 0; color: #5eead4; font: 500 14px Inter, sans-serif; cursor: pointer; padding: 0; margin-left: 6px; }
  .links { margin-left: auto; }
  .links a { color: #5eead4; text-decoration: none; }
  .swagger-ui .topbar { display: none; }
  .swagger-ui .info { margin: 30px 0 20px; }
</style>
</head>
<body>
  <header class="bar">
    <div class="wrap">
      <button class="btn" id="startBtn" type="button">Try it live</button>
      <span class="status" id="status"></span>
      <span class="session" id="session">Signed in with test wallets. Press Execute on any endpoint. <button class="link-btn" id="resetBtn" type="button">Reset</button></span>
      <span class="local" id="local" style="display:none">Running locally: requests go to http://localhost:3000.</span>
      <span class="links"><a href="https://github.com/mighty-odewumi/kosta">Source code</a></span>
    </div>
  </header>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.35.0/swagger-ui-bundle.js" crossorigin></script>
  <script>
  (function () {
    var PLACEHOLDER = '3fa85f64-5717-4562-b3fc-2c963f66afa6';
    var KEY_PLACEHOLDER = 'new-key-per-click';
    var STORE = 'kosta-docs-session';
    var state = load() || {};
    var base = '';

    function load() { try { return JSON.parse(localStorage.getItem(STORE)); } catch (e) { return null; } }
    function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
    function uuid() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'k-' + Date.now().toString(16) + '-' + Math.random().toString(16).slice(2);
    }
    function $(id) { return document.getElementById(id); }

    function setStatus(text, isError) {
      var el = $('status');
      el.textContent = text;
      el.className = 'status' + (isError ? ' err' : '');
    }

    function render() {
      var on = !!(state.key && state.walletA);
      $('session').className = 'session' + (on ? ' on' : '');
      $('startBtn').style.display = on ? 'none' : '';
      if (on) setStatus('');
    }

    function authorize(key) {
      state.key = key;
      save();
      if (window.ui) {
        window.ui.authActions.authorize({
          bearerAuth: { name: 'bearerAuth', schema: { type: 'http', scheme: 'bearer' }, value: key }
        });
      }
    }

    function call(method, path, body) {
      var headers = { 'content-type': 'application/json' };
      if (state.key) headers.authorization = 'Bearer ' + state.key;
      return fetch(base + path, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined })
        .then(function (r) {
          return r.json().then(function (data) {
            if (!r.ok) throw new Error((data && data.error && data.error.message) || ('Request failed (' + r.status + ')'));
            return data;
          });
        });
    }

    function startSession() {
      var btn = $('startBtn');
      btn.disabled = true;
      setStatus('Connecting...');
      var slow = setTimeout(function () {
        setStatus('Waking the server, this can take about 30 seconds...');
      }, 4000);
      state = {};
      call('POST', '/sandbox/api-keys', { role: 'admin', name: 'docs-visitor' })
        .then(function (res) { clearTimeout(slow); authorize(res.api_key); setStatus('Setting up...'); })
        .then(function () { return call('POST', '/v1/accounts', { currency: 'NGN', label: "Ada's wallet" }); })
        .then(function (a) { state.walletA = a.id; return call('POST', '/v1/accounts', { currency: 'NGN', label: "Tunde's wallet" }); })
        .then(function (b) { state.walletB = b.id; setStatus('Setting up...'); return call('POST', '/sandbox/deposits', { account_id: state.walletA, amount: 500000 }); })
        .then(function (d) { state.balanceA = d.balance; save(); render(); setStatus(''); })
        .catch(function (e) { clearTimeout(slow); setStatus('Could not start: ' + e.message, true); })
        .then(function () { btn.disabled = false; });
    }

    function resetSession() {
      state = {};
      save();
      if (window.ui) window.ui.authActions.logout(['bearerAuth']);
      render();
    }

    // Fill Swagger's placeholder ids with the visitor's own sandbox ids, and give every
    // money-moving request a fresh Idempotency-Key unless the visitor typed their own.
    function requestInterceptor(req) {
      if (req.url && req.url.indexOf(PLACEHOLDER) !== -1) {
        var id = /withdrawals\//.test(req.url) ? state.lastWithdrawal
          : /transfers\//.test(req.url) ? state.lastTransfer
          : state.walletA;
        if (id) req.url = req.url.split(PLACEHOLDER).join(id);
      }
      if (typeof req.body === 'string' && req.body.indexOf(PLACEHOLDER) !== -1) {
        try {
          var body = JSON.parse(req.body);
          if (body.account_id === PLACEHOLDER && state.walletA) body.account_id = state.walletA;
          if (body.from_account_id === PLACEHOLDER && state.walletA) body.from_account_id = state.walletA;
          if (body.to_account_id === PLACEHOLDER && state.walletB) body.to_account_id = state.walletB;
          req.body = JSON.stringify(body, null, 2);
        } catch (e) {}
      }
      if (req.headers) {
        Object.keys(req.headers).forEach(function (h) {
          if (h.toLowerCase() === 'idempotency-key' && req.headers[h] === KEY_PLACEHOLDER) req.headers[h] = uuid();
        });
      }
      return req;
    }

    function responseInterceptor(res) {
      var url = res.url || '';
      var data = res.body || {};
      if (res.status === 201) {
        if (/\/sandbox\/api-keys$/.test(url) && data.api_key) authorize(data.api_key);
        else if (/\/v1\/accounts$/.test(url) && data.id) {
          if (!state.walletA) state.walletA = data.id; else state.walletB = data.id;
        }
        else if (/\/v1\/transfers$/.test(url) && data.id) state.lastTransfer = data.id;
        else if (/\/v1\/withdrawals$/.test(url) && data.id) state.lastWithdrawal = data.id;
        save();
        render();
      }
      return res;
    }

    $('startBtn').addEventListener('click', startSession);
    $('resetBtn').addEventListener('click', resetSession);

    fetch('openapi.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (spec) {
      var servedByApi = location.pathname.indexOf('/docs') === 0;
      if (servedByApi) spec.servers = [{ url: location.origin, description: 'This server' }];
      var server = (spec.servers || [])[0];
      base = server ? server.url.replace(/\/$/, '') : location.origin;
      var hasSandbox = (spec.tags || []).some(function (t) { return t.name === 'Sandbox'; });
      var isLocal = base.indexOf('localhost') !== -1 && location.hostname !== 'localhost';
      if (!hasSandbox || isLocal) {
        $('startBtn').style.display = 'none';
        $('session').style.display = 'none';
        $('local').style.display = '';
      }

      window.ui = SwaggerUIBundle({
        spec: spec,
        dom_id: '#swagger-ui',
        deepLinking: true,
        docExpansion: 'list',
        defaultModelsExpandDepth: 0,
        displayRequestDuration: true,
        persistAuthorization: true,
        tryItOutEnabled: true,
        filter: true,
        requestInterceptor: requestInterceptor,
        responseInterceptor: responseInterceptor,
        presets: [SwaggerUIBundle.presets.apis],
        layout: 'BaseLayout',
        onComplete: function () { if (state.key) authorize(state.key); render(); }
      });
    });
  })();
  </script>
</body>
</html>
